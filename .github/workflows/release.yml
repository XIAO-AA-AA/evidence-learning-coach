name: Release

on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test and build
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/package.py
      - name: Publish downloadable archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          RELEASE_VERSION=$(tr -d '\r\n' < VERSION)
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid VERSION'; exit 1; }
          RELEASE_TAG="v$RELEASE_VERSION"
          gh release create "$RELEASE_TAG" dist/evidence-learning-coach.zip dist/evidence-learning-coach-project.zip dist/SHA256SUMS.txt --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes
